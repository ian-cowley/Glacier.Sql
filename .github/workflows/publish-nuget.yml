name: Build, Test, and Publish NuGet

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup NuGet sources
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github-packages \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Restore dependencies
        run: dotnet restore Glacier.Sql.slnx

      - name: Build (Release)
        run: dotnet build Glacier.Sql.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/Glacier.Sql.Tests/Glacier.Sql.Tests.csproj --configuration Release --no-restore --no-build --blame-hang --blame-hang-dump-type none --blame-hang-timeout 60s

      - name: Audit NuGet vulnerabilities
        run: dotnet list Glacier.Sql.slnx package --vulnerable --include-transitive

      - name: Pack NuGet package
        run: dotnet pack src/Glacier.Sql/Glacier.Sql.csproj --configuration Release --no-build --output packages

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source github-packages --skip-duplicate

      - name: NuGet Trusted Publishing Login (OIDC)
        id: login
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: NuGet/login@v1
        continue-on-error: true
        with:
          user: spuriousbugfix

      - name: Publish to nuget.org
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        env:
          OIDC_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          FALLBACK_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          API_KEY="${OIDC_KEY:-$FALLBACK_KEY}"
          if [ -z "$API_KEY" ]; then
            echo "::error::Neither OIDC token nor NUGET_API_KEY secret is configured."
            exit 1
          fi
          dotnet nuget push "packages/*.nupkg" --api-key "$API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.nupkg
          generate_release_notes: true
